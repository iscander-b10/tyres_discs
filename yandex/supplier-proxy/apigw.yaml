openapi: 3.0.0
info:
  title: tyres-discs supplier proxy
  version: 2.1.0

# Глобальный CORS (заменяет CORS-заголовки из облачной функции для всех маршрутов)
x-yc-apigateway-cors:
  origins:
    - "*"
  methods:
    - GET
    - OPTIONS
  headers:
    - "*"
  max-age: 86400

x-yc-apigateway:
  service_account_id: "ajebole4ctgqp45f4437" # ← замени на свой реальный ID сервисного аккаунта
  variables:
    SUPPLIER_PROXY_FUNCTION_ID:
      default: "d4ehp73ttejr687820if" # ← замени на актуальный ID облачной функции
      description: "Yandex Cloud Function ID for supplier-proxy"

paths:
  # Старые публичные пути закрыты: вкладки со старым JS больше не грузят прайсы.
  /:
    get:
      summary: Отключённый публичный маршрут
      responses:
        "403":
          description: Forbidden
      x-yc-apigateway-integration:
        type: dummy
        http_code: 403
        http_headers:
          Content-Type: application/json
        content:
          application/json: '{"error":"Gone"}'

  /b2b/{path+}:
    get:
      summary: Отключённый публичный маршрут
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
      responses:
        "403":
          description: Forbidden
      x-yc-apigateway-integration:
        type: dummy
        http_code: 403
        http_headers:
          Content-Type: application/json
        content:
          application/json: '{"error":"Gone"}'

  /z34/{path+}:
    get:
      summary: Отключённый публичный маршрут
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
      responses:
        "403":
          description: Forbidden
      x-yc-apigateway-integration:
        type: dummy
        http_code: 403
        http_headers:
          Content-Type: application/json
        content:
          application/json: '{"error":"Gone"}'

  /vershina/{path+}:
    get:
      summary: Отключённый публичный маршрут
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
      responses:
        "403":
          description: Forbidden
      x-yc-apigateway-integration:
        type: dummy
        http_code: 403
        http_headers:
          Content-Type: application/json
        content:
          application/json: '{"error":"Gone"}'

  # =========================================================================
  #  Актуальные маршруты (/v2) — только новая сборка фронта
  # =========================================================================
  /v2:
    options:
      summary: CORS preflight (облачная функция)
      responses:
        "204":
          description: No content
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: ${var.SUPPLIER_PROXY_FUNCTION_ID}
    get:
      summary: Proxy supplier request (cloud function)
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
          description: Encoded target URL (https://...)
        - name: purpose
          in: query
          required: false
          schema:
            type: string
            enum: [price, image]
      responses:
        "200":
          description: Upstream response
        "4XX":
          description: Validation / allowlist errors
        "5XX":
          description: Upstream/proxy errors
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: ${var.SUPPLIER_PROXY_FUNCTION_ID}

  /v2/metrics/load:
    options:
      summary: CORS preflight
      responses:
        "204":
          description: No content
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: ${var.SUPPLIER_PROXY_FUNCTION_ID}
    get:
      summary: Событие кнопки «Загрузить данные» (логи админа)
      parameters:
        - name: metricEvent
          in: query
          required: true
          schema:
            type: string
            enum: [load-start, load-finish]
        - name: loadId
          in: query
          required: false
          schema:
            type: string
        - name: ok
          in: query
          required: false
          schema:
            type: string
        - name: hadClientErrors
          in: query
          required: false
          schema:
            type: string
        - name: hadSaveErrors
          in: query
          required: false
          schema:
            type: string
        - name: suppliers
          in: query
          required: false
          schema:
            type: string
      responses:
        "204":
          description: Logged
        "400":
          description: Unknown metricEvent
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: ${var.SUPPLIER_PROXY_FUNCTION_ID}

  /v2/b2b/{path+}:
    get:
      summary: Прямой прокси → b2b.4tochki.ru
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
          description: Остаток пути после /v2/b2b/
      responses:
        "200":
          description: Ответ от b2b.4tochki.ru
      x-yc-apigateway-integration:
        type: http
        url: https://b2b.4tochki.ru/{path}
        method: GET

  /v2/z34/{path+}:
    get:
      summary: Прямой прокси → z34.ru
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ответ от z34.ru
      x-yc-apigateway-integration:
        type: http
        url: https://z34.ru/{path}
        method: GET
        query:
          '*': '*'
        headers:
          Host: z34.ru
          Accept: '{Accept}'
          '*': '*'
        omitEmptyHeaders: true

  /v2/vershina/{path+}:
    get:
      summary: Прямой прокси → vershinatyres.ru
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ответ от vershinatyres.ru
      x-yc-apigateway-integration:
        type: http
        url: https://vershinatyres.ru/{path}
        method: GET
        query:
          '*': '*'
        headers:
          Host: vershinatyres.ru
          Accept: '{Accept}'
          '*': '*'
        omitEmptyHeaders: true
        timeouts:
          connect: 5
          read: 60
